# Every test env is <python>-<django>-<database>, e.g. `tox -e py313-dj52-pg`.
# sqlite needs nothing; pg and mysql read their connection from TEST_PG_* /
# TEST_MYSQL_* in the environment or in .env (see .env.example).
[tox]
requires =
    tox>=4.30
    tox-uv>=1.28
env_list =
    lint
    type
    docs
    py{311,312}-dj42-{sqlite,pg,mysql}
    py{311,315}-dj52-{sqlite,pg,mysql}
    py{312,315}-dj60-{sqlite,pg,mysql}
    py{312,315}-dj61-{sqlite,pg,mysql}

[testenv]
description = run the test suite with {base_python} on {env:TEST_DB}
dependency_groups = test
deps =
    dj42: Django>=4.2,<5.0
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
extras =
    pg: postgres
    mysql: mysql
pass_env =
    PYTEST_*
    FORCE_COLOR
    TEST_DB
    TEST_PG_*
    TEST_MYSQL_*
set_env =
    # separate coverage data files for `tox -p`
    COVERAGE_FILE = {env_dir}/.coverage
    sqlite: TEST_DB = sqlite
    pg: TEST_DB = pg
    mysql: TEST_DB = mysql
commands =
    pytest {posargs:--cov --cov-report=term}

[testenv:lint]
description = run all pre-commit hooks
skip_install = true
dependency_groups = lint
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:type]
description = type check with ty
dependency_groups =
    test
    lint
commands =
    ty check

[testenv:docs]
description = build the developer's guide (Zensical, strict)
skip_install = true
dependency_groups = docs
commands =
    zensical build --strict --clean
