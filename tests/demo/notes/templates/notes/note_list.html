{% extends "base.html" %}
{% block content %}
  <h1>Notes</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add</button>
  </form>
  <ul>
    {% for note in notes %}
      <li><strong>{{ note.title }}</strong> — {{ note.body }} <small>{{ note.created_at }}</small></li>
    {% empty %}
      <li>No notes yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
