# Release a version tag pushed by a maintainer (see RELEASE.md): build, publish to PyPI, then
# create the GitHub release.
#
# The tag is created on develop by `cz bump` and pushed only after develop is merged into main:
# the workflow refuses a tag that is not in main's history or that does not match the package version.
#
# PyPI accepts the upload through Trusted Publishing (no token): the publisher registered on
# pypi.org names this file and the `pypi` environment, which only v* tags and main can deploy to.
name: Release

on:
  push:
    tags: ["v*"]
  # Release an existing tag with the current workflow: Actions > Release > Run workflow, from main.
  # A re-run would not do: it uses the workflow as it was at the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, for example v0.3.0
        required: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # main's history, for the ancestry check
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Check the tag is in main and matches the package version
        run: |
          [[ "$TAG" =~ ^v[0-9] ]] || { echo "::error::$TAG is not a version tag"; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/main \
            || { echo "::error::$TAG is not in main's history: merge develop into main first"; exit 1; }
          version="$(uv version --short --color never)"  # FORCE_COLOR would wrap it in ANSI codes
          test "v$version" = "$TAG" \
            || { echo "::error::$TAG does not match version $version in pyproject.toml"; exit 1; }
      - run: uv build
      - name: Import the wheel in a clean environment
        run: >-
          uv run --isolated --no-project --with dist/*.whl
          python -c "import django_db_tenants; print(django_db_tenants.__version__)"
      # The section `cz bump` wrote for this version, without its heading. Kept out of dist/,
      # which is uploaded to PyPI as it is.
      - name: Release notes from CHANGELOG.md
        run: |
          mkdir notes
          awk -v tag="$TAG" '/^## /{p = ($2 == tag); next} p' CHANGELOG.md > notes/release-notes.md || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-db-tenants/
    permissions:
      id-token: write  # the OIDC token PyPI checks against the trusted publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Also uploads attestations of where the files were built (shown on PyPI).
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  # After PyPI, so a failed upload never leaves a GitHub release without its package.
  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create / upload
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes/
      # Without a changelog section (v0.1.0 predates CHANGELOG.md), GitHub generates the notes.
      # An existing release (created by hand, or by an earlier run) only gets the files replaced.
      - name: Create or update the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            if [ -s notes/release-notes.md ]; then notes=(--notes-file notes/release-notes.md); else notes=(--generate-notes); fi
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" "${notes[@]}"
          fi
