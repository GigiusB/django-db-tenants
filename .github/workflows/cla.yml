# Contributor License Agreement check (see CLA.md and CONTRIBUTING.md).
#
# Fails on a pull request until every commit author has signed CLA.md by commenting the
# sentence below on it (the bot posts it too). Signatures are committed to signatures/cla.json on
# the cla-signatures branch, which must exist and must not be protected:
#   git push origin "$(git commit-tree "$(git hash-object -t tree /dev/null)" -m 'chore: store CLA signatures')":refs/heads/cla-signatures
#
# StepSecurity's maintained fork of contributor-assistant/github-action (archived upstream);
# free for public repositories. pull_request_target runs this workflow from the base branch with
# write access: it never checks out the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write  # commits signatures/cla.json
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
          && (github.event.comment.body == 'recheck'
              || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: step-security/contributor-assistant-github-action@b9bd60bf1b766fa48dae03427059187137236239  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/GigiusB/django-db-tenants/blob/develop/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The maintainer owns the code; bots cannot sign.
          allowlist: GigiusB,dependabot[bot],github-actions[bot]
          signed-commit-message: "chore: $contributorName signed the CLA in #$pullRequestNo"
          create-file-commit-message: "chore: create the CLA signatures file"
          custom-notsigned-prcomment: >-
            Thank you for your contribution. django-db-tenants is released under the PolyForm
            Noncommercial License and also sold under commercial licenses, so contributions can be
            merged only after their authors sign our [Contributor License Agreement](https://github.com/GigiusB/django-db-tenants/blob/develop/CLA.md).
            To sign, post the comment below. If you contribute on behalf of your employer, see the
            [Corporate CLA](https://github.com/GigiusB/django-db-tenants/blob/develop/CLA-CORPORATE.md).
