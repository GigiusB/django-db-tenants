[environment]
python-version = "3.11"
extra-paths = ["tests/_extra", "tests/demo"]

[src]
include = ["src", "tests"]

# factory_boy's `class Meta` options are not subclasses of the base factory's Meta.
[[overrides]]
include = ["tests/_extra/testutils/factories.py"]
rules = { incompatible-attribute-override = "ignore" }
