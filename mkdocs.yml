site_name: django-db-tenants
site_description: Developer's guide for django-db-tenants, database-per-client multi-tenancy for Django.
site_url: https://gigiusb.github.io/django-db-tenants/
repo_url: https://github.com/GigiusB/django-db-tenants
repo_name: GigiusB/django-db-tenants
edit_uri: edit/develop/docs/  # the published site is built from develop

docs_dir: docs
site_dir: site
strict: true
# `mkdocs serve` also reloads when docstrings change.
watch:
  - src
  - tools/mkdocs_linkcheck.py

# Pages link each other with relative site paths ("../api/settings/"), which mkdocs does not
# validate: the hook checks every link and anchor of the built site instead (warnings fail --strict).
hooks:
  - tools/mkdocs_linkcheck.py
validation:
  links:
    unrecognized_links: ignore

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # Navigation comes from the `.pages` files next to the pages.
  - awesome-pages
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_root_full_path: true
            show_source: false
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_", "!^log$"]
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
