[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-db-tenants"
version = "0.1.0"
description = "Database-per-client multi-tenancy for Django with runtime database registration and optional per-tenant OIDC single sign-on."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Giovanni Bronzini", email = "g.bronzini@gmail.com" }]
keywords = ["django", "multi-tenant", "database-router", "sso", "oidc"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "Django>=4.2",
    "cryptography>=41",
    "django-strategy-field>=3.2",
]

[project.optional-dependencies]
# django_db_tenants.oidc: OidcStrategy's login views. requests is required by authlib.integrations.django_client.
oidc = ["Authlib>=1.3", "requests>=2.28"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["mysqlclient>=2.2"]

[project.urls]
Homepage = "https://github.com/GigiusB/django-db-tenants"
Repository = "https://github.com/GigiusB/django-db-tenants"

# PEP 735 dependency groups. `uv sync` installs the `dev` group by default;
# tox (see tox.ini) only installs `test` (plus the Django version and database driver under test).
[dependency-groups]
test = [
    "pytest>=9",
    "pytest-django>=4.11",
    "pytest-cov>=6",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    # the oidc extra, for the OidcStrategy tests
    "Authlib>=1.3",
    "requests>=2.28",
]
lint = [
    "ruff>=0.15",
    "ty>=0.0.90",
    "django-stubs>=5.2",
    "pre-commit>=4",
]
# Drivers for running pytest directly with TEST_DB=pg|mysql (mysqlclient builds against libmysqlclient).
db = [
    "psycopg[binary]>=3.1",
    "mysqlclient>=2.2",
]
# Developer's guide in docs/ (mkdocs.yml): `uv run mkdocs serve`.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-awesome-pages-plugin>=2.10",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
    "ruff>=0.15",  # mkdocstrings formats the API signatures with it
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "db" },
    { include-group = "docs" },
    "tox>=4.30",
    "tox-uv>=1.28",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_db_tenants*"]

[tool.setuptools.package-data]
django_db_tenants = ["py.typed"]
