# Install once with:  uv run pre-commit install
# Run on everything:  uv run pre-commit run --all-files   (or: uv run tox -e lint)
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without `stages` would also run at commit-msg; commitizen declares its own stage.
default_stages: [pre-commit]
default_language_version:
  python: python3
exclude: ^tests/demo/var/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: \.drawio\.png$  # editable diagrams (docs/), image + embedded source
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  # Commit messages follow Conventional Commits: `cz bump` derives the version from them (RELEASE.md).
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "4.2"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ty needs the project's dependencies to resolve imports, so it runs from the uv environment.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types: [python]
        pass_filenames: false
      # Zensical builds a page missing from the explicit nav without warning, but leaves it out of the menu.
      - id: zensical-nav
        name: zensical nav lists every docs page
        entry: uv run --frozen python tools/check_zensical_nav.py
        language: system
        files: ^(docs/.*\.md|zensical\.toml|tools/check_zensical_nav\.py)$
        pass_filenames: false
